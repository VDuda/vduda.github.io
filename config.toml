## Basic Configuration
baseURL = 'https://vlad-duda.com/'
builddrafts = false
canonifyurls = false
locale = 'en-US'

contentdir = 'content'
layoutdir = 'layouts'
publishdir = 'public'

title = 'Vlad Duda'

theme = 'hugo-goa'

## Hugo Built-in Features
enableRobotsTXT = true
timeZone = 'America/New_York'

[module.hugoVersion]
min = '0.169.0'

# Syntax highlighting is generated as HTML/CSS, without browser JavaScript.
[markup.highlight]
style = 'github'

## Site Settings
[params]
author = 'Vlad Duda'
intro = 'Pragmatist'

# description = """
# Now <a href='https://rit.rakuten.co.jp'>@Rakuten</a>, 
# Previously <a href='https://maxwellhealth.com'>@MaxwellHealth</a>, 
# <a href='https://nuodb.com'>@NuoDB</a> and <a href='https://TheLightWalk.com'>@TheLightWalk</a>. 
# <br/> \"Simplicity is the ultimate sophistication.\"
# """
authorimage = 'vlad-b-g.png'
dateformat = 'Jan 2, 2006'

## Site Meta Settings
[params.meta]
description = 'Simple minimalist Vlad Duda'
keywords = 'minimalist,vlad,duda,blog,goa,hugo,pragmatist'

## Social Accounts
[params.social]
github = 'Vduda'
instagram = 'vladuda'
# xing = '<username>'
linkedin = 'vduda'
twitter = 'BigBostonGuy'
#facebook = '<username>'
#google = '<username>'
#stackoverflow = '<username>'
email = 'vlad@duda.wtf'

## Extras
[params.extra]
copyright = '© {year}. Vlad Duda. [Some Rights Reserved](https://creativecommons.org/licenses/by/3.0/).'
poweredby = false
highlightjs = false

