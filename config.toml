## Basic Configuration
baseURL = 'https://vlad-duda.com/'
builddrafts = false
canonifyurls = false
locale = 'en-US'

contentdir = 'content'
layoutdir = 'layouts'
publishdir = 'public'

title = 'Vlad Duda — Pragmatist'

theme = 'hugo-goa'

## Hugo Built-in Features
enableRobotsTXT = true
timeZone = 'America/New_York'

[module.hugoVersion]
min = '0.169.0'

# Syntax highlighting is generated as HTML/CSS, without browser JavaScript.
[markup.highlight]
style = 'github'

## Site Settings
[params]
author = 'Vlad Duda'
intro = 'Finance, AI, and how things work.'

description = 'Engineer, founder, and pragmatist. I build software and follow my curiosity across technology, markets, and the systems behind them.'

authorimage = 'vlad-b-g.png'
dateformat = 'Jan 2, 2006'

## Site Meta Settings
[params.meta]
description = 'Vlad Duda — Finance, AI, and how things work. A personal notebook on technology, markets, and building software.'
keywords = 'Vlad Duda,finance,AI,software,writing'

## Social Accounts
[params.social]
github = 'VDuda'
# xing = '<username>'
linkedin = 'vduda'
x = 'BigBostonGuy'
#facebook = '<username>'
#google = '<username>'
#stackoverflow = '<username>'
email = 'vlad@usenomad.ai'

## Extras
[params.extra]
copyright = '© {year}. Vlad Duda.'
poweredby = false
highlightjs = false

