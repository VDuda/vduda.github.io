<footer class="site-footer">
  <div class="footer-main">
    <p class="copyright">{{ replace site.Params.extra.copyright "{year}" (string now.Year) | markdownify }}</p>
    {{ partial "social.html" (dict "id" "footer-socials" "label" "Footer social profiles") }}
  </div>
  <nav class="resource-links" aria-label="Resources">
    {{ range site.Menus.resources }}<a href="{{ .URL }}">{{ .Name }} <span aria-hidden="true">↗</span></a>{{ end }}
    <a href="{{ "index.xml" | relURL }}">RSS feed</a>
  </nav>
</footer>
